[package]
name = "solana-vault-prototype"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_vault_prototype"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
# litesvm-0.10.0 depends on solana-account 3.x. Bumping this to a 4.x release
# introduces a second version of the crate into the dependency graph; because
# solana_account::Account from 4.x and 3.x are distinct Rust types, every
# svm.set_account() call in the test suite would fail to compile with
# E0308 mismatched types.  Do not upgrade past the 3.x series until litesvm
# itself migrates to solana-account 4.x.
solana-account = "3.4.0"
solana-pubkey = { version = "4.0.0", features = ["curve25519"] }
solana-clock = "3.0.0"
base64 = "0.22.1"
bincode = "1.3.3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
