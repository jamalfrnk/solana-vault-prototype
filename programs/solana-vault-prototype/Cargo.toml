[package]
name = "solana-vault-prototype"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_vault_prototype"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.15.2"
solana-message = "4.4.0"
solana-transaction = "4.1.5"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "4.3.1"
solana-pubkey = { version = "4.0.0", features = ["curve25519"] }
solana-clock = "3.0.0"
base64 = "0.23.0"
bincode = "1.3.3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
