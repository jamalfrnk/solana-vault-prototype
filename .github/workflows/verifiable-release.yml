name: Verifiable release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AGAVE_VERSION: v3.1.10
  ANCHOR_VERSION: "1.0.2"

jobs:
  verifiable-release:
    name: Docker-verifiable build and evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free additional disk space
        # The Docker-verifiable build (a full second SBF compile inside a
        # pulled Docker image) plus the ordinary prebuild below can exceed a
        # standard runner's free disk; these preinstalled toolchains are
        # unused by this repository and safe to remove.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install pinned Rust, Agave, and Anchor toolchains
        run: |
          rustup show
          bash .devcontainer/post-create.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Record identity-file hashes before any Anchor invocation
        run: |
          sha256sum Anchor.toml programs/solana-vault-prototype/src/lib.rs \
            > /tmp/identity-before.sha256
          cat /tmp/identity-before.sha256

      - name: Pre-create target/deploy to suppress Anchor's initial-build keys sync
        # Anchor's CLI (cli/src/lib.rs) runs an unconditional program-id sync
        # exactly once, gated only on `!target/deploy.exists()` (added in
        # solana-foundation/anchor#3023) -- independent of --ignore-keys, which
        # only skips a *separate* mismatch check for a keypair that already
        # exists. On a fresh checkout target/deploy is always absent, so that
        # sync fires and rewrites declare_id!()/Anchor.toml to a freshly
        # generated keypair's address every run, making the compiled binary
        # non-reproducible across independent dispatches. Pre-creating the
        # (empty) directory here makes `!target/deploy.exists()` false, so the
        # sync never runs and the committed program ID is what gets compiled
        # in, every time.
        run: |
          mkdir -p target/deploy
          if compgen -G "target/deploy/*-keypair.json" > /dev/null; then
            echo "::error::A keypair already exists before any build ran; refusing to proceed." >&2
            exit 1
          fi

      - name: Ordinary prebuild (populates target/deploy/*.so for IDL extraction)
        # anchor build --verifiable's own host-side IDL-extraction step
        # recompiles the test crate, which needs target/deploy/*.so via
        # include_bytes! in tests/test_pause.rs. The verifiable Docker build
        # only ever writes target/verifiable/*.so, so without this ordinary
        # prebuild first, IDL extraction fails with a missing-file error.
        #
        # Uses bare `cargo build-sbf` rather than `anchor build --ignore-keys`
        # deliberately: the latter also runs its own IDL-extraction phase as
        # part of the same command, recompiling and executing the entire test
        # crate in debug mode a second time -- output this step never needs,
        # since only the verifiable build's own IDL matters. That redundant
        # compile (on top of the Docker build repeating the SBF compile a
        # third time) was what exhausted the runner's disk in an earlier
        # attempt. `cargo build-sbf` produces the identical
        # target/deploy/solana_vault_prototype.so with none of that: it is
        # Solana's own subcommand, entirely unaware of Anchor's declare_id!()
        # sync wrapper, so it also cannot touch program identity.
        run: cargo build-sbf --manifest-path programs/solana-vault-prototype/Cargo.toml

      - name: Assert the ordinary prebuild kept the committed identity stable
        run: |
          test -s target/deploy/solana_vault_prototype.so
          sha256sum -c /tmp/identity-before.sha256
          git diff --exit-code

      - name: Build in Anchor's pinned verifiable Docker environment
        run: anchor build --verifiable --ignore-keys

      - name: Assert the verifiable build kept the committed identity stable
        run: |
          test -s target/verifiable/solana_vault_prototype.so
          test -s target/idl/solana_vault_prototype.json
          sha256sum -c /tmp/identity-before.sha256
          git diff --exit-code

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install repository dependencies
        run: |
          corepack enable
          corepack yarn install --frozen-lockfile

      - name: Generate deterministic verifiable-build evidence
        run: |
          npx ts-node scripts/generate_release_evidence.ts \
            --repository-root . \
            --program target/verifiable/solana_vault_prototype.so \
            --idl target/idl/solana_vault_prototype.json \
            --output target/release-evidence/verifiable-release-evidence.json \
            --build-kind verifiable \
            --anchor-version "$ANCHOR_VERSION" \
            --agave-version "$AGAVE_VERSION" \
            --rust-version 1.89.0

      - name: Stage only approved release artifacts
        # An explicit allowlist, not a broad target/** glob, so nothing under
        # target/deploy (where a keypair would live, if one ever existed) can
        # be uploaded even by accident.
        run: |
          mkdir -p release-artifacts
          install -m 0644 target/verifiable/solana_vault_prototype.so release-artifacts/
          install -m 0644 target/idl/solana_vault_prototype.json release-artifacts/
          install -m 0644 target/release-evidence/verifiable-release-evidence.json release-artifacts/
          if find release-artifacts -iname '*keypair*' -o -iname 'id.json' -o -iname 'wallet*.json' | grep -q .; then
            echo "::error::Keypair-shaped file found in release-artifacts; refusing to upload." >&2
            exit 1
          fi

      - name: Upload verifiable release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifiable-release-${{ github.sha }}
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: error
