name: Verifiable release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AGAVE_VERSION: v3.1.10
  ANCHOR_VERSION: "1.0.2"

jobs:
  verifiable-release:
    name: Docker-verifiable build and evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Rust, Agave, and Anchor toolchains
        run: |
          rustup show
          bash .devcontainer/post-create.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Build in Anchor's pinned verifiable Docker environment
        run: anchor build --verifiable --ignore-keys

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install repository dependencies
        run: |
          corepack enable
          corepack yarn install --frozen-lockfile

      - name: Generate deterministic verifiable-build evidence
        run: |
          npx ts-node scripts/generate_release_evidence.ts \
            --repository-root . \
            --program target/verifiable/solana_vault_prototype.so \
            --idl target/idl/solana_vault_prototype.json \
            --output target/release-evidence/verifiable-release-evidence.json \
            --build-kind verifiable \
            --anchor-version "$ANCHOR_VERSION" \
            --agave-version "$AGAVE_VERSION" \
            --rust-version 1.89.0

      - name: Upload verifiable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifiable-release-${{ github.sha }}
          path: |
            target/verifiable/solana_vault_prototype.so
            target/idl/solana_vault_prototype.json
            target/release-evidence/verifiable-release-evidence.json
          retention-days: 90
          if-no-files-found: error
